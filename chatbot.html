<div class="chatbot-widget" data-chatbot>
    <button class="chatbot-toggle" type="button" aria-label="Open AI chat assistant" aria-expanded="false">
        <span class="chatbot-toggle-icon">AI</span>
        <span class="chatbot-toggle-dot"></span>
    </button>

    <section class="chatbot-panel" aria-label="AI chat assistant">
        <div class="chatbot-header">
            <div>
                <strong>EventPro AI</strong>
                <span>Offline assistant</span>
            </div>
            <button class="chatbot-close" type="button" aria-label="Close chat assistant">&times;</button>
        </div>

        <div class="chatbot-messages" data-chatbot-messages>
            <div class="chatbot-message bot">
                Hi! Ask me about events, booking, payment, reports, login, or how this website works.
            </div>
        </div>

        <form class="chatbot-form" data-chatbot-form>
            <input type="text" name="message" autocomplete="off" placeholder="Ask about events..." aria-label="Ask the chatbot">
            <button type="submit">Send</button>
        </form>
    </section>
</div>

<script id="chatbot-event-data" type="application/json">{{ chatbot_events|tojson }}</script>
