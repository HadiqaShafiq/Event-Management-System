<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Event Management System | Login</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="background">
        <div class="login-box"> 
            
            <!-- TAB BUTTONS -->
            <div class="tab-container">
                <button class="tab-button active" data-tab-target="login" type="button">Login</button>
                <button class="tab-button" data-tab-target="signup" type="button">Sign Up</button>
            </div>

            <!-- LOGIN TAB -->
            <div id="login" class="tab-content active">
                <h2>Login</h2>
                <p class="subtitle">Welcome back! Please login</p>

                {% if error %}
                <div class="error-message">{{ error }}</div>
                {% endif %}

                {% if success %}
                <div class="success-message">{{ success }}</div>
                {% endif %}

                <form method="POST" action="{{ url_for('login') }}">
                    <div class="form-group">
                        <input type="email" name="email" placeholder="Email Address" required>
                    </div>
                    <div class="form-group">
                        <input type="password" name="password" id="password" placeholder="Password" required>
                        <div class="form-options">
                            <label>
                                Show Password <input type="checkbox" data-password-toggle="password">
                            </label>
                        </div>
                    </div>
                    <button type="submit" class="btn-login">Login</button>
                </form>
            </div>

            <!-- SIGNUP TAB -->
            <div id="signup" class="tab-content">
                <h2>Sign Up</h2>
                <p class="subtitle">Create a new account</p>

                {% if registration_errors %}
                <div class="error-message">
                    <ul class="error-list">
                        {% for error in registration_errors %}
                        <li>{{ error }}</li>
                        {% endfor %}
                    </ul>
                </div>
                {% endif %}

                <form method="POST" action="/register" id="signupForm">
                    <div id="signupPasswordError" class="error-message" hidden></div>

                    <div class="form-row">
                        <div class="form-group">
                            <input type="text" name="first_name" placeholder="First Name" required>
                        </div>
                        <div class="form-group">
                            <input type="text" name="last_name" placeholder="Last Name" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <input type="text" name="reg_no" placeholder="Registration No" required>
                        </div>
                        <div class="form-group">
                            <input type="text" name="phone" placeholder="Phone Number" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <input type="text" name="campus" placeholder="Campus" required>
                        </div>
                        <div class="form-group">
                            <select name="role" required>
                                <option value="">Select Role</option>
                                <option value="user">User</option>
                                <option value="admin">Admin</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <input type="text" name="department" placeholder="Department" required>
                    </div>

                    <div class="form-group email-check">
                        <input 
                            type="email" 
                            name="email" 
                            id="email" 
                            placeholder="Email Address" 
                            required data-check-email
                        >
                        <span id="emailCheckResult" class="email-check-result"></span>
                    </div>

                    <div class="form-group">
                        <input 
                            type="password" 
                            name="password" 
                            id="signup-password" 
                            placeholder="Password (8+ chars, mixed case, numbers/symbols)" 
                            required data-password-strength-source
                        >
                        <div id="passwordStrength" class="password-strength"></div>
                    </div>

                    <div class="form-group">
                        <input 
                            type="password" 
                            name="confirm_password" 
                            id="confirm-password" 
                            placeholder="Confirm Password" 
                            required
                        >
                        <div class="form-options">
                            <label>
                                Show Password <input type="checkbox" data-password-toggle="signup-password">
                            </label>
                        </div>
                    </div>

                    <button type="submit" class="btn-login">Sign Up</button>
                </form>
            </div>

        </div>
    </div>
    {% include 'chatbot.html' %}
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
